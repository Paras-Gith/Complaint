name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py config.py models.py security_tests.py complaint_app
      - name: Ruff lint
        run: ruff check --select E4,E7,E9,F,I app.py security_tests.py complaint_app
      - name: Ruff formatting
        run: ruff format --check app.py complaint_app
      - name: Mypy strict incremental gate
        run: >-
          python -m mypy
          --follow-imports=skip
          --disable-error-code=misc
          --disable-error-code=no-any-return
          --disable-error-code=untyped-decorator
          --disable-error-code=union-attr
          app.py complaint_app
      - name: Security and behavior regression tests
        run: python security_tests.py

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install audit tool
        run: python -m pip install "pip-audit>=2.9,<3"
      - name: Audit runtime and development dependencies
        run: pip-audit -r requirements-dev.txt

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
