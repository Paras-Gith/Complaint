{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card gate-student"><div class="card-body p-4">
  <p class="tag">For students</p>
  <h3 class="mb-3">Student Login</h3>
  <form method="post" class="needs-validation" novalidate>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-primary w-100">Login</button>
  </form>
  <p class="mt-3 mb-1 text-center">New student? <a href="{{ url_for('register') }}">Register</a></p>
  <p class="mb-0 text-center small"><a href="{{ url_for('admin_login') }}">Administrator? Login here</a></p>
</div></div></div></div>
{% endblock %}
