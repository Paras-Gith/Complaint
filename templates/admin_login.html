{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
<div class="card shadow-sm border-top border-danger border-3"><div class="card-body p-4">
  <h3 class="mb-3"><i class="bi bi-shield-lock text-danger"></i> Admin Login</h3>
  <form method="post" class="needs-validation" novalidate>
    <div class="mb-3"><label class="form-label">Admin Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
    <button class="btn btn-danger w-100">Login as Admin</button>
  </form>
  <p class="mt-3 mb-0 text-center small"><a href="{{ url_for('login') }}">Student? Login here</a></p>
</div></div></div></div>
{% endblock %}
