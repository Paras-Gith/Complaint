{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow-sm"><div class="card-body p-4">
  <h3 class="mb-3">Student Registration</h3>
  <form method="post" class="needs-validation" novalidate>
    <div class="mb-3"><label class="form-label">Full Name</label><input name="name" class="form-control" required></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label">Roll No.</label><input name="roll_no" class="form-control"></div>
      <div class="col-md-6 mb-3"><label class="form-label">Department</label><input name="department" class="form-control"></div>
    </div>
    <div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password (min 6 chars)</label><input type="password" name="password" minlength="6" class="form-control" required></div>
    <button class="btn btn-primary w-100">Create Account</button>
  </form>
</div></div></div></div>
{% endblock %}
